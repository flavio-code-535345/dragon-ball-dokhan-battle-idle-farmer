name: Build + Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker Hub repository: <DOCKER_USERNAME>/<DOCKERHUB_REPO>
  DOCKERHUB_REPO: dokkan-idle-farmer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: python -m pytest

      - name: Web UI script syntax
        run: node --check src/dokkan_farmer/web/static/app.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Repository secrets (Settings -> Secrets and variables -> Actions):
      #   DOCKER_USERNAME  your Docker Hub user name
      #   DOCKER_PASSWORD  a Docker Hub access token with Read & Write scope
      # Without them the image is only published to ghcr.io.
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dokkan-farmer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name farmer -p 8080:8080 -e DEVICE_BACKEND=sim dokkan-farmer:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/status | tee status.json
          grep -q '"connected":true' status.json
          docker exec farmer adb version
          docker exec farmer tini --version
          docker exec farmer sh -c 'modprobe --version && test -x /usr/local/bin/host-setup'
          curl -fsS -X POST http://localhost:8080/api/farm/start \
            -H 'Content-Type: application/json' -d '{"routine": "dokkan_auto_farm"}'
          sleep 15
          curl -fsS http://localhost:8080/api/status | grep -q '"state":"running"'
          docker logs farmer

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Hub not configured
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME == ''
        run: echo "::notice::Add the DOCKER_USERNAME and DOCKER_PASSWORD secrets to publish to Docker Hub too."

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.DOCKER_USERNAME || 'docker-hub-disabled' }}/${{ env.DOCKERHUB_REPO }},enable=${{ env.DOCKER_USERNAME != '' }}
            name=ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

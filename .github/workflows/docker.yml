name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dokkan-farmer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name farmer -p 8080:8080 -e DEVICE_BACKEND=sim dokkan-farmer:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/status | tee status.json
          grep -q '"connected":true' status.json
          docker exec farmer adb version
          docker exec farmer tini --version
          curl -fsS -X POST http://localhost:8080/api/farm/start \
            -H 'Content-Type: application/json' -d '{"routine": "dokkan_auto_farm"}'
          sleep 15
          curl -fsS http://localhost:8080/api/status | grep -q '"state":"running"'
          docker logs farmer

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (and push) linux/amd64 + linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Android emulator end-to-end

# Runs the emulator stack (docker-compose.emulator.yml) on a GitHub runner with
# KVM: Android 11 with Google Play boots, the farmer connects and sees ARM
# translation. With "game" ticked it installs Dokkan (APKPure's build, through the
# farmer's Apps card source) and starts it; screenshots and logs are kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Also install Dokkan (APKPure, through the farmer) and start it
        type: boolean
        default: true
      emulator_flags:
        description: Override the emulator's EXTRA_FLAGS (empty = the stack's default)
        type: string
        default: ""
      game_arch:
        description: The game build to ask APKPure for, e.g. arm64-v8a (empty = APKPure's choice)
        type: string
        default: ""
      gpu:
        description: The emulator's renderer (ANDROID_GPU), empty = the stack's default
        type: string
        default: ""
      grow_disk:
        description: "Test that a restart and growing Android's storage to 32 GB keep its data (any value = yes)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Runs with different settings may run side by side.
  group: emulator-e2e-${{ inputs.emulator_flags }}-${{ inputs.game_arch }}-${{ inputs.gpu }}-${{ inputs.grow_disk }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: dokkan-farmer
      IMAGE_TAG: e2e
      BASE: http://localhost:8080
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (higher pull limits)
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          nproc; free -g; df -h / | tail -1

      - name: Build the farmer image
        run: docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: Start the emulator stack
        env:
          EMULATOR_FLAGS: ${{ inputs.emulator_flags }}
          GPU: ${{ inputs.gpu }}
        run: |
          cat > e2e.override.yml <<'EOF'
          services:
            farmer:
              pull_policy: never
          EOF
          if [ -n "$EMULATOR_FLAGS" ]; then
            printf '  android:\n    environment:\n      EXTRA_FLAGS: "%s"\n' "$EMULATOR_FLAGS" >> e2e.override.yml
          fi
          cat e2e.override.yml
          [ -n "$GPU" ] && export ANDROID_GPU="$GPU"
          ANDROID_CORES=$(nproc) docker compose -f docker-compose.emulator.yml -f e2e.override.yml up -d
          sleep 5
          docker exec dokkan-android grep -n "GPU_MODE=" /tmp/start-emulator.sh || true

      - name: Wait for Android to boot
        run: |
          adb() { docker exec -u farmer dokkan-farmer adb "$@"; }
          boot=""
          for i in $(seq 1 120); do
            adb connect android:5555 >/dev/null 2>&1 || true
            boot=$(adb -s android:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
            [ "$boot" = "1" ] && break
            sleep 5
          done
          docker logs dokkan-android 2>&1 | tail -40
          [ "$boot" = "1" ] || exit 1
          echo "Android booted after about $((i * 5)) s"
          docker exec dokkan-android sh -c 'ps -eo args | grep -m1 "[q]emu-system" | grep -oE -- "-gpu [a-z_]+"' || true

      - name: The farmer sees Android with ARM translation and Google Play
        run: |
          for i in $(seq 1 30); do
            curl -sS --fail-with-body -X POST "$BASE/api/device/refresh" > device.json && jq -e .connected device.json >/dev/null && break
            sleep 5
          done
          jq . device.json
          jq -e '.connected and (.info.abilist | contains("arm64-v8a")) and (.info.abilist | contains("armeabi-v7a"))' device.json
          docker exec -u farmer dokkan-farmer adb -s android:5555 shell "wm size; wm density"
          docker exec -u farmer dokkan-farmer adb -s android:5555 shell pm path com.android.vending
          mkdir -p shots
          capture=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture")
          echo "$capture"
          id=$(echo "$capture" | jq -r .frame_id)
          curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=360" -o shots/home.jpg
          # The farmer's screenshots must match the screen it taps on.
          size=$(docker exec -u farmer dokkan-farmer adb -s android:5555 shell wm size | tr -d '\r' | awk '/Physical/ { print $3 }')
          echo "screenshot $(echo "$capture" | jq -r '"\(.width)x\(.height)"'), screen $size"
          [ "$(echo "$capture" | jq -r '"\(.width)x\(.height)"')" = "$size" ]
          # ...and show what Android shows: compare with Android's own screencap.
          id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
          curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=1080" -o farmer.jpg
          docker exec -u farmer dokkan-farmer adb -s android:5555 exec-out screencap -p > android.png
          docker cp farmer.jpg dokkan-farmer:/tmp/farmer.jpg
          docker cp android.png dokkan-farmer:/tmp/android.png
          docker exec dokkan-farmer python -c '
          import sys, cv2, numpy as np
          a, b = cv2.imread("/tmp/farmer.jpg"), cv2.imread("/tmp/android.png")
          print("farmer", a.shape, "mean %.1f std %.1f" % (a.mean(), a.std()))
          print("android", b.shape, "mean %.1f std %.1f" % (b.mean(), b.std()))
          if a.shape != b.shape or a.std() < 5:
              sys.exit("not the screen Android shows")
          diff = float(np.abs(a.astype(int) - b.astype(int)).mean())
          print("mean difference %.2f" % diff)
          # Same screen: ~6 (JPEG), ~15 with the host renderer (16-bit display); a black,
          # stale or rotated frame: 60+.
          sys.exit(0 if diff < 25 else "not the screen Android shows")'

      - name: Android's storage (and with grow_disk, that restarts keep Android's data)
        env:
          GROW: ${{ inputs.grow_disk }}
        run: |
          adb() { docker exec -u farmer dokkan-farmer adb -s android:5555 "$@"; }
          show() {
            adb shell df -h /data | tail -1
            docker exec dokkan-android sh -c 'grep -iE "dataPartition.size" /data/android.avd/config.ini; ls -la /data/android.avd | grep -iE "userdata"' || true
          }
          wait_boot() {
            boot=""
            for i in $(seq 1 60); do
              docker exec -u farmer dokkan-farmer adb connect android:5555 >/dev/null 2>&1 || true
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
              [ "$boot" = "1" ] && return 0
              sleep 5
            done
            return 1
          }
          mark() { adb shell "echo $1 > /sdcard/Download/$1.txt"; }
          kept() { [ "$(adb shell cat /sdcard/Download/$1.txt | tr -d '\r')" = "$1" ] && echo "== $1: the file written just before is still there"; }
          show
          [ -n "$GROW" ] || exit 0

          # 1. A restart keeps what Android wrote just before (clean shutdown on docker stop).
          mark restart
          time docker stop dokkan-android
          docker logs --tail 15 dokkan-android 2>&1 | grep -v "bad fde" || true
          docker start dokkan-android
          wait_boot
          kept restart

          # 2. Growing the storage keeps Android's data too.
          mark grow
          printf '  android:\n    environment:\n      EXTRA_FLAGS: "-vsync-rate 30 -partition-size 32768"\n' >> e2e.override.yml
          docker compose -f docker-compose.emulator.yml -f e2e.override.yml up -d android
          wait_boot
          echo "== after growing"
          show
          kept grow
          kept restart

      - name: Live view speed (10 frames, 720 px wide)
        run: |
          for i in $(seq 1 10); do
            curl -sS --fail-with-body -o /dev/null -w "%{time_total}\n" "$BASE/api/screen/live.jpg?w=720"
          done | awk '{ sum += $1; print "frame " NR ": " $1 " s" } END { printf "average %.3f s = %.1f fps\n", sum / NR, NR / sum }'
          docker logs dokkan-farmer 2>&1 | grep -i "screenshots" || true
          # docker-compose.emulator.yml sets EMULATOR_CONSOLE: the emulator's own screenshots.
          docker logs dokkan-farmer 2>&1 | grep -q "Screenshots: from the emulator console"

      - name: Screenshot speed inside the emulator container (diagnostics)
        run: |
          docker exec dokkan-android sh -c '
            ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
            mkdir -p /tmp/s
            for i in 1 2 3 4 5; do
              t=$(date +%s%N); adb -s emulator-5554 exec-out screencap > /dev/null; echo "android raw screencap: $(ms $t) ms"
            done
            for i in 1 2 3 4 5; do
              t=$(date +%s%N); adb -s emulator-5554 emu screenrecord screenshot /tmp/s > /dev/null; echo "emulator console screenshot: $(ms $t) ms"
            done
            ls -la /tmp/s | tail -3' || true

      - name: Install Dokkan through the farmer (APKPure, the Apps card's button)
        if: inputs.game
        env:
          GAME_ARCH: ${{ inputs.game_arch }}
        run: |
          source="apkpure:com.bandainamcogames.dbzdokkanww${GAME_ARCH:+@$GAME_ARCH}"
          curl -sS --fail-with-body -X POST "$BASE/api/apps/install" -H 'Content-Type: application/json' \
            -d "{\"source\": \"$source\"}"
          for i in $(seq 1 450); do
            job=$(curl -sS --fail-with-body "$BASE/api/apps/job")
            state=$(echo "$job" | jq -r .job.state)
            { [ "$state" = done ] || [ "$state" = error ]; } && break
            sleep 2
          done
          echo "$job" | jq .
          [ "$state" = done ]
          curl -sS --fail-with-body "$BASE/api/apps" | tee apps.json | jq .
          jq -e '.installed and .abi_ok != false' apps.json

      - name: Start Dokkan and watch it
        if: inputs.game
        run: |
          adb() { docker exec -u farmer dokkan-farmer adb -s android:5555 "$@"; }
          adb logcat -c || true
          curl -sS --fail-with-body -X POST "$BASE/api/device/app" -H 'Content-Type: application/json' \
            -d '{"action": "launch"}'
          for t in 20 40 60 90 120 180; do
            sleep $((t - ${last:-0})); last=$t
            id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
            curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=360" -o "shots/dokkan-${t}s.jpg"
            echo "== ${t}s: pid $(adb shell pidof com.bandainamcogames.dbzdokkanww | tr -d '\r')"
            adb shell "dumpsys activity activities | grep -E 'ResumedActivity' | head -2"
          done
          # Past the start screens: dismiss Android's full-screen hint, then tap the middle.
          adb shell input tap 858 528
          for round in 1 2 3 4 5 6 7 8; do
            adb shell input tap 540 1300
            sleep 20
            id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
            curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=360" -o "shots/dokkan-tap${round}.jpg"
            echo "== tap $round: pid $(adb shell pidof com.bandainamcogames.dbzdokkanww | tr -d '\r')"
          done
          adb shell "dumpsys package com.bandainamcogames.dbzdokkanww | grep -E 'primaryCpuAbi|versionName' | head -n 3"
          # The game's screen from the farmer (emulator console) and from Android's screencap.
          id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
          curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=1080" -o farmer-game.jpg
          adb exec-out screencap -p > android-game.png
          docker cp farmer-game.jpg dokkan-farmer:/tmp/fg.jpg
          docker cp android-game.png dokkan-farmer:/tmp/ag.png
          docker exec dokkan-farmer python -c '
          import cv2
          a, b = cv2.imread("/tmp/fg.jpg"), cv2.imread("/tmp/ag.png")
          for name, im in (("farmer (console)", a), ("android screencap", b)):
              print(name, im.shape, "mean B G R", [round(float(im[:, :, c].mean()), 1) for c in range(3)])
          cv2.imwrite("/tmp/ag.jpg", cv2.resize(b, (360, 640), interpolation=cv2.INTER_AREA))'
          docker cp dokkan-farmer:/tmp/ag.jpg shots/dokkan-screencap.jpg
          adb logcat -d -b crash > shots/logcat-crash.txt || true
          adb logcat -d > shots/logcat.txt || true
          grep -iE "dokkan|bandai|native.?bridge|ndk_trans|FATAL|SIGILL|SIGSEGV|root" \
            shots/logcat.txt | tail -120 || true
          echo "== crash buffer"; tail -60 shots/logcat-crash.txt

      - name: Restart the android container (the same container keeps /tmp and /data)
        run: |
          docker restart dokkan-android
          adb() { docker exec -u farmer dokkan-farmer adb "$@"; }
          boot=""
          for i in $(seq 1 60); do
            adb connect android:5555 >/dev/null 2>&1 || true
            boot=$(adb -s android:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
            [ "$boot" = "1" ] && break
            sleep 5
          done
          docker logs --tail 30 dokkan-android 2>&1 | grep -v "bad fde" || true
          [ "$boot" = "1" ]
          echo "Android booted again after about $((i * 5)) s"
          for i in $(seq 1 12); do
            curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" && break
            sleep 5
          done
          echo

      - name: Screenshots in the log (base64 JPEG, one per line)
        if: always()
        run: |
          for f in shots/*.jpg; do
            [ -f "$f" ] && echo "SHOT $(basename "$f") $(base64 -w0 "$f")"
          done
          true

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-e2e
          path: shots/
          if-no-files-found: ignore

      - name: Logs of the stack
        if: always()
        run: |
          docker compose -f docker-compose.emulator.yml -f e2e.override.yml ps -a || true
          docker logs dokkan-android 2>&1 | tail -60 || true
          docker logs dokkan-farmer 2>&1 | tail -60 || true

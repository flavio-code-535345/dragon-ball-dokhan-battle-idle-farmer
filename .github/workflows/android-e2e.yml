name: Android end-to-end (redroid)

# Runs the all-in-one stack (docker-compose.redroid.yml) on a GitHub runner:
# host-setup loads binder, Android 14 boots with ARM translation, the farmer
# connects and installs Aurora Store from F-Droid through its own API.
# With "game" ticked it also installs Dokkan and starts it, to see whether the
# game runs on redroid (screenshots and logs are kept as an artifact).
on:
  workflow_dispatch:
    inputs:
      game:
        description: Also install Dokkan (from APKPure, via apkeep) and start it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-e2e
  cancel-in-progress: true

jobs:
  redroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: dokkan-farmer
      IMAGE_TAG: e2e
      BASE: http://localhost:8080
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (higher pull limits)
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Kernel modules (Ubuntu ships binder in linux-modules-extra)
        run: |
          uname -a
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" \
            || echo "::warning::no linux-modules-extra package for $(uname -r)"
          modinfo binder_linux | head -5 || true

      - name: Build the farmer image
        run: docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: Start the all-in-one stack
        run: |
          cat > e2e.override.yml <<'EOF'
          services:
            host-setup:
              pull_policy: never
            farmer:
              pull_policy: never
          EOF
          compose() { docker compose -f docker-compose.redroid.yml -f e2e.override.yml "$@"; }
          status=0
          compose up -d || status=$?
          compose logs host-setup
          cat /etc/modules-load.d/redroid.conf /etc/modprobe.d/redroid.conf || true
          exit "$status"

      - name: Wait for Android to boot
        run: |
          adb() { docker exec -u farmer dokkan-farmer adb "$@"; }
          boot=""
          for i in $(seq 1 72); do
            adb connect redroid:5555 >/dev/null 2>&1 || true
            boot=$(adb -s redroid:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            docker logs dokkan-redroid 2>&1 | tail -80
            exit 1
          fi
          echo "Android booted after about $((i * 5)) s"

      - name: The farmer sees Android with ARM translation
        run: |
          for i in $(seq 1 30); do
            curl -sS --fail-with-body -X POST "$BASE/api/device/refresh" > device.json && jq -e .connected device.json >/dev/null && break
            sleep 5
          done
          jq . device.json
          jq -e '.connected and (.info.abilist | contains("arm64-v8a"))' device.json
          jq -e '.info.native_bridge | test("libnb|ndk")' device.json

      - name: Install Aurora Store through the farmer (F-Droid)
        run: |
          mkdir -p shots
          curl -sS --fail-with-body -X POST "$BASE/api/apps/install" -H 'Content-Type: application/json' \
            -d '{"source": "fdroid:com.aurora.store"}'
          for i in $(seq 1 150); do
            job=$(curl -sS --fail-with-body "$BASE/api/apps/job")
            state=$(echo "$job" | jq -r .job.state)
            { [ "$state" = done ] || [ "$state" = error ]; } && break
            sleep 2
          done
          echo "$job" | jq .
          [ "$state" = done ]
          curl -sS --fail-with-body -X POST "$BASE/api/device/app" -H 'Content-Type: application/json' \
            -d '{"action": "launch", "package": "com.aurora.store"}'
          sleep 20
          id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
          curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=360" -o shots/aurora.jpg
          docker exec -u farmer dokkan-farmer adb -s redroid:5555 shell \
            "dumpsys activity activities | grep -E 'ResumedActivity' | head -3"

      - name: Download Dokkan (APKPure via apkeep)
        if: inputs.game
        run: |
          curl -fsSL -o apkeep \
            https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep
          mkdir game
          # The 64-bit build: redroid's ARM translation only covers arm64-v8a.
          ./apkeep -d apk-pure -o acknowledge_dangers=true,arch=arm64-v8a \
            -a com.bandainamcogames.dbzdokkanww game
          ls -la game

      - name: Install Dokkan through the farmer (upload)
        if: inputs.game
        run: |
          file=$(ls game/* | head -n 1)
          curl -sS --fail-with-body -T "$file" "$BASE/api/apps/upload?filename=$(basename "$file")"
          for i in $(seq 1 300); do
            job=$(curl -sS --fail-with-body "$BASE/api/apps/job")
            state=$(echo "$job" | jq -r .job.state)
            { [ "$state" = done ] || [ "$state" = error ]; } && break
            sleep 2
          done
          echo "$job" | jq .
          [ "$state" = done ]
          curl -sS --fail-with-body "$BASE/api/apps" | tee apps.json | jq .
          jq -e '.installed and .abi_ok != false' apps.json

      - name: Start Dokkan and watch it
        if: inputs.game
        run: |
          adb() { docker exec -u farmer dokkan-farmer adb -s redroid:5555 "$@"; }
          adb logcat -c || true
          curl -sS --fail-with-body -X POST "$BASE/api/device/app" -H 'Content-Type: application/json' \
            -d '{"action": "launch"}'
          for t in 15 30 60 90 150; do
            sleep $((t - ${last:-0})); last=$t
            id=$(curl -sS --fail-with-body -X POST "$BASE/api/screen/capture" | jq -r .frame_id)
            curl -sS --fail-with-body "$BASE/api/screen.jpg?frame=$id&w=360" -o "shots/dokkan-${t}s.jpg"
            echo "== ${t}s: pid $(adb shell pidof com.bandainamcogames.dbzdokkanww | tr -d '\r')"
            adb shell "dumpsys activity activities | grep -E 'ResumedActivity' | head -2"
          done
          adb shell "pm dump com.bandainamcogames.dbzdokkanww | grep -E 'primaryCpuAbi|versionName'" || true
          adb logcat -d -b crash > shots/logcat-crash.txt || true
          adb logcat -d > shots/logcat.txt || true
          grep -iE "dokkan|bandai|native.?bridge|libnb|ndk_trans|FATAL|SIGILL|SIGSEGV|root" \
            shots/logcat.txt | tail -150 || true
          echo "== crash buffer"; tail -60 shots/logcat-crash.txt

      - name: Screenshots in the log (base64 JPEG, one per line)
        if: always()
        run: |
          for f in shots/*.jpg; do
            [ -f "$f" ] && echo "SHOT $(basename "$f") $(base64 -w0 "$f")"
          done
          true

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e
          path: shots/
          if-no-files-found: ignore

      - name: Logs of the stack
        if: always()
        run: |
          docker compose -f docker-compose.redroid.yml -f e2e.override.yml ps -a || true
          docker logs dokkan-farmer 2>&1 | tail -100 || true

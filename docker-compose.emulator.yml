# All-in-one stack with Google's Android emulator: Android 11 with Google Play runs in a
# container next to the farmer. Use it where Docker cannot reach the kernel's binder
# driver that redroid needs, e.g. Docker inside a Proxmox LXC container.
# Read docs/DEVICE_SETUP.md ("Option C") for the details.
#
# Needs hardware virtualization (KVM, /dev/kvm). For Docker in a Proxmox LXC container,
# run this once on the Proxmox host (102 = the container's ID), then deploy:
#   pct set 102 -dev0 /dev/kvm,mode=0666 && pct reboot 102
#
# The emulator image (github.com/HQarroum/docker-android) translates ARM apps such as
# Dokkan and comes with the Play Store.
# Plan ~8 GB RAM and ~20 GB disk for Android + Dokkan.
services:
  android:
    image: ${EMULATOR_IMAGE:-halimqarroum/docker-android:api-30-playstore}
    container_name: dokkan-android
    restart: unless-stopped
    # Before the emulator starts: no password on its console (only the farmer can reach
    # it, no port is published), a folder for the screenshots it hands to the farmer, and
    # the renderer from EMULATOR_GPU (the image's script always uses swiftshader_indirect).
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /screens && chmod 0777 /screens
        : > /root/.emulator_console_auth_token
        if [ "$$EMULATOR_GPU" = host ]; then export GPU_ACCELERATED=true; fi
        sed "s/GPU_MODE=\"swiftshader_indirect\"/GPU_MODE=\"$$EMULATOR_GPU\"/" /opt/start-emulator.sh > /tmp/start-emulator.sh
        chmod +x /tmp/start-emulator.sh
        exec /tmp/start-emulator.sh
    devices:
      - /dev/kvm
    environment:
      MEMORY: ${ANDROID_MEMORY:-6144}
      CORES: ${ANDROID_CORES:-4}
      # How Android's graphics are drawn (all on the CPU): swiftshader_indirect, guest,
      # swangle_indirect, or host (OpenGL of the image's virtual X display).
      EMULATOR_GPU: ${ANDROID_GPU:-swiftshader_indirect}
      # Android's screen refresh rate: 30 fps halves the CPU spent drawing the game
      # (60 = smoother, more CPU). The farm runs the same either way.
      EXTRA_FLAGS: -vsync-rate ${ANDROID_FPS:-30}
    volumes:
      # Android's storage (apps, game data) survives restarts and updates.
      - android-data:/data
      # The emulator lets its own adb key in without a prompt; the farmer uses it too.
      - adb-keys:/root/.android
      - screens:/screens

  farmer:
    image: ${IMAGE:-flavio11113/dokkan-idle-farmer}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: dokkan-farmer
    restart: unless-stopped
    depends_on:
      - android
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Android of the emulator service above (the farmer waits for it to boot).
      ADB_SERIAL: android:5555
      # Screenshots straight from the emulator (~0.1 s instead of ~1 s through Android).
      EMULATOR_CONSOLE: android:5554
      GAME_PACKAGE: ${GAME_PACKAGE:-global}
      AUTOSTART: ${AUTOSTART:-resume}
      ACTIVE_HOURS: ${ACTIVE_HOURS:-}
      TZ: ${TZ:-UTC}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      NOTIFY_URLS: ${NOTIFY_URLS:-}
      NOTIFY_EVERY_RUNS: ${NOTIFY_EVERY_RUNS:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - farmer-data:/data
      - adb-keys:/data/adb
      - screens:/screens

volumes:
  android-data:
  farmer-data:
  adb-keys:
  # In memory: screenshots only pass through here.
  screens:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m

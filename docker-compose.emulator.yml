# All-in-one stack with Google's Android emulator: Android 11 with Google Play runs in a
# container next to the farmer. Use it where Docker cannot reach the kernel's binder
# driver that redroid needs, e.g. Docker inside a Proxmox LXC container.
# Read docs/DEVICE_SETUP.md ("Option C") for the details.
#
# Needs hardware virtualization (KVM, /dev/kvm). For Docker in a Proxmox LXC container,
# run this once on the Proxmox host (102 = the container's ID), then deploy:
#   pct set 102 -dev0 /dev/kvm,mode=0666 && pct reboot 102
#
# The emulator image (github.com/HQarroum/docker-android) translates ARM apps such as
# Dokkan and comes with the Play Store.
# Plan ~8 GB RAM and ~20 GB disk for Android + Dokkan.
services:
  android:
    image: ${EMULATOR_IMAGE:-halimqarroum/docker-android:api-30-playstore}
    container_name: dokkan-android
    restart: unless-stopped
    # Before the emulator starts: locks left by an earlier run of this container (a restart
    # keeps /tmp and /data) removed, no password on its console (only the farmer can reach
    # it, no port is published), a folder for the screenshots it hands to the farmer, and
    # the renderer from EMULATOR_GPU (the image's script would use swiftshader_indirect).
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /tmp/.X0-lock /tmp/.X11-unix/X0; rm -rf /data/android.avd/*.lock
        mkdir -p /screens && chmod 0777 /screens
        : > /root/.emulator_console_auth_token
        if [ "$$EMULATOR_GPU" = host ]; then export GPU_ACCELERATED=true; fi
        sed "s/GPU_MODE=\"swiftshader_indirect\"/GPU_MODE=\"$$EMULATOR_GPU\"/" /opt/start-emulator.sh > /tmp/start-emulator.sh
        chmod +x /tmp/start-emulator.sh
        # Android's storage: STORAGE_MB for a new Android. An existing one keeps its size:
        # Android encrypts its storage, and resizing it would lose Android's data.
        img=/data/android.avd/userdata-qemu.img
        if [ -f "$$img" ]; then
          have=$$(( $$(stat -c %s "$$img") / 1048576 ))
          if [ "$$STORAGE_MB" -gt "$$have" ]; then
            echo "Android's storage stays at $$have MB (growing it would lose its data); for $$STORAGE_MB MB start a new Android: docs/DEVICE_SETUP.md, insufficient space"
          fi
          STORAGE_MB=$$have
        fi
        export EXTRA_FLAGS="$$EXTRA_FLAGS -partition-size $$STORAGE_MB"
        # Android's screen size (SCREEN empty = the emulator's own 1080x1920).
        if [ -n "$$SCREEN" ]; then
          export EXTRA_FLAGS="$$EXTRA_FLAGS -skin $$SCREEN -prop qemu.sf.lcd_density=$$DENSITY"
        fi
        # On "docker stop": flush Android's disk, then close the emulator cleanly. Killed, it
        # loses what Android wrote last (game data, settings).
        stop() {
          timeout 20 adb -s emulator-5554 shell sync
          timeout 20 adb -s emulator-5554 emu kill
          wait "$$pid"
          exit 0
        }
        trap stop TERM INT
        /tmp/start-emulator.sh &
        pid=$$!
        wait "$$pid"
    # Time for the clean shutdown above (Docker kills after 10 s by default).
    stop_grace_period: 60s
    # At most this many of the server's CPU cores (0 = no limit): Dokkan uses every core it
    # gets, so this caps the stack's power draw while the game is on screen (it runs slower).
    # With the screen off (POWER_SAVE) the emulator idles either way.
    cpus: ${ANDROID_CPUS:-0}
    devices:
      - /dev/kvm
    # The "host" renderer logs many harmless "libunwind: ... bad fde" lines: keep the log small.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MEMORY: ${ANDROID_MEMORY:-6144}
      CORES: ${ANDROID_CORES:-4}
      # How Android's graphics are drawn, all on the CPU. "host" (Mesa's OpenGL on a virtual
      # X display) draws Dokkan right; with the image's swiftshader_indirect its shaders
      # fail ("glGetAttribLocation ... error 0x501") and the game shows in red only.
      EMULATOR_GPU: ${ANDROID_GPU:-host}
      # Power: the emulator draws the game on the CPU and takes every core it gets. Measured
      # on 4-core runners: 1080x1920 at 30 Hz 3.9 cores (the game at 10 fps), 720x1280 at
      # 15 Hz 2.0 to 3.1 cores (the game at 13 to 15 fps). The farmer scales its templates to
      # the screen; Android's layout stays phone-like with the density (dpi).
      SCREEN: ${ANDROID_SCREEN-720x1280}
      DENSITY: ${ANDROID_DENSITY:-280}
      # Android's screen refresh rate (30 or 60 = smoother live view, more CPU; the farm runs
      # the same either way). -grpc: the emulator's gRPC port, without a token: the farmer's
      # live view gets frames as they are drawn (no port is published, only the stack's
      # containers reach it).
      EXTRA_FLAGS: -vsync-rate ${ANDROID_FPS:-15} -grpc 8554
      # Android's storage in MB, for a new Android (the image's own 6 GB fills up during
      # Dokkan's download: "insufficient space"). An existing Android keeps its size.
      STORAGE_MB: ${ANDROID_STORAGE_MB:-32768}
    volumes:
      # Android's storage (apps, game data) survives restarts and updates.
      - android-data:/data
      # The emulator lets its own adb key in without a prompt; the farmer uses it too.
      - adb-keys:/root/.android
      - screens:/screens

  farmer:
    image: ${IMAGE:-flavio11113/dokkan-idle-farmer}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: dokkan-farmer
    restart: unless-stopped
    depends_on:
      - android
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Android of the emulator service above (the farmer waits for it to boot).
      ADB_SERIAL: android:5555
      # Screenshots straight from the emulator (~0.1 s instead of ~1 s through Android), and
      # the live view at the game's frame rate (gRPC; the console is the fallback).
      EMULATOR_CONSOLE: android:5554
      EMULATOR_GRPC: android:8554
      GAME_PACKAGE: ${GAME_PACKAGE:-global}
      AUTOSTART: ${AUTOSTART:-resume}
      ACTIVE_HOURS: ${ACTIVE_HOURS:-}
      TZ: ${TZ:-UTC}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      NOTIFY_URLS: ${NOTIFY_URLS:-}
      NOTIFY_EVERY_RUNS: ${NOTIFY_EVERY_RUNS:-0}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - farmer-data:/data
      - adb-keys:/data/adb
      - screens:/screens

volumes:
  android-data:
  farmer-data:
  adb-keys:
  # In memory: screenshots only pass through here.
  screens:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dokkan-idle-farmer"
version = "0.1.0"
description = "Self-hosted idle farmer for Dragon Ball Z Dokkan Battle: Docker/Portainer, ADB + OpenCV, mobile web UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "apprise>=1.8",
  "grpcio>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.6"]

[project.scripts]
dokkan-farmer = "dokkan_farmer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dokkan_farmer = ["routines/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

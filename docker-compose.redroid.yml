# All-in-one stack: Android (redroid) runs in a container on this server, next to the
# farmer. No phone needed. Read docs/DEVICE_SETUP.md ("Option C") for the details.
#
# Needs a Linux server (x86_64 or ARM64) whose kernel has the "binder" driver: the
# host-setup service below loads it. Plan ~4 GB RAM and ~15 GB disk for Android + Dokkan.
# Dokkan itself has not been tested on redroid yet (see the docs); a phone always works.
#
# Portainer: Stacks -> Add stack -> Web editor (paste this file) or Repository with the
# compose path "docker-compose.redroid.yml". Then open http://<your-server>:8080 ->
# Device tab -> Apps: "Install Aurora Store", "Open Aurora Store", install Dokkan.
services:
  # One-shot: loads the binder driver into the host kernel and writes
  # /etc/modules-load.d/redroid.conf so the host loads it after reboots, too.
  host-setup:
    image: ${IMAGE:-flavio11113/dokkan-idle-farmer}:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["host-setup"]
    privileged: true
    restart: "no"
    environment:
      RUN_AS_ROOT: "true"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /etc/modules-load.d:/host-etc/modules-load.d
      - /etc/modprobe.d:/host-etc/modprobe.d
    healthcheck:
      disable: true

  # Android 14. The x86_64 image translates ARM apps such as Dokkan (libndk_translation).
  # Newer redroid images (15, 16) lack that translator on x86_64: keep 14 there.
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0-latest}
    container_name: dokkan-redroid
    privileged: true
    restart: unless-stopped
    depends_on:
      host-setup:
        condition: service_completed_successfully
    volumes:
      - redroid-data:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=${REDROID_FPS:-30}
      # guest = software rendering (works everywhere), host = the server's Intel/AMD GPU
      - androidboot.redroid_gpu_mode=${REDROID_GPU_MODE:-guest}
      - androidboot.use_memfd=1
    # Only to reach Android from your PC (scrcpy, adb). It is an unprotected root shell:
    # never forward this port to the internet.
    # ports:
    #   - "5555:5555"

  farmer:
    image: ${IMAGE:-flavio11113/dokkan-idle-farmer}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: dokkan-farmer
    restart: unless-stopped
    depends_on:
      - redroid
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Android of the redroid service above (the farmer waits for it to boot).
      ADB_SERIAL: redroid:5555
      GAME_PACKAGE: ${GAME_PACKAGE:-global}
      AUTOSTART: ${AUTOSTART:-resume}
      ACTIVE_HOURS: ${ACTIVE_HOURS:-}
      TZ: ${TZ:-UTC}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      NOTIFY_URLS: ${NOTIFY_URLS:-}
      NOTIFY_EVERY_RUNS: ${NOTIFY_EVERY_RUNS:-0}
      # redroid's screen never sleeps; no need to touch its power settings.
      KEEP_SCREEN_ON: "false"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - farmer-data:/data

volumes:
  redroid-data:
  farmer-data:

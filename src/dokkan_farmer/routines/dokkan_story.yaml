# Dokkan Story: plays the Dragon Ball Story from where you are to the end of
# the series, for the first-clear Dragon Stones of every stage.
#
# Dragon Ball Story (home screen → START → Dragon Ball Story) has series
# (Dragon Ball, Z, GT, Movies), each a wheel of sagas; a saga's stage list shows
# its cleared stages and the next one with a NEW mark. This routine plays that
# stage on Normal like Dokkan Clear New Stages (it taps where you move on the
# map and a ki sphere in battle), and when a saga has no NEW stage left it goes
# back to the saga wheel, turns it one saga further and opens that one. When
# several sagas in a row have nothing to play, the series is done and it stops.
#
# Quest: Dokkan Story (START → Quest) works the same way: a chapter is a list
# of areas, and an area with uncleared stages has a NEW mark; when an area has
# no NEW stage left, the routine goes back to the area list and opens the next
# NEW area.
#
# How to use it: open the saga wheel of a series in Dokkan and turn it to the
# saga to start with (the first one: the bottom of the wheel), or open that
# saga's stage list, or a Quest chapter's area list. Then start this routine
# (saga_wheel is only needed for the Dragon Ball Story's saga wheel). Templates are shared with
# Dokkan Clear New Stages; this one also needs saga_wheel and back_button.
#
# Full reference: docs/ROUTINES.md
name: Dokkan Story
description: >-
  Plays the Dragon Ball Story saga by saga for the first-clear Dragon Stones:
  the NEW stage of each saga on Normal, then on to the next saga of the wheel,
  until the end of the series.
version: 1

options:
  max_stages:
    label: Stop after N cleared stages (0 = at the end of the series)
    type: number
    default: 0
    min: 0
  retries:
    label: Tries again after a defeat (0 = stop at the first defeat)
    type: number
    default: 1
    min: 0
    max: 20
    help: >-
      The farmer always taps "Give up", never a paid revive. The count starts
      again after each cleared stage.
  start_in:
    label: Where to start
    type: choice
    choices: [here, quest]
    default: here
    help: >-
      here = you opened a stage list, area list or saga wheel yourself.
      quest = from the home screen: START, Quest Dokkan Story, the chapter wheel
      (turned "Quest: wheel turns" times), the chapter. Also brings the farm back
      after a restart of the game.
  chapter_turns:
    label: "Quest: wheel turns before opening the chapter"
    type: number
    default: 0
    min: 0
    max: 20
    help: >-
      Short swipes of the chapter wheel towards later chapters before its
      selected chapter is opened (0 = the chapter that is selected when the wheel
      opens; one turn from Chapter 6 gives Chapter 7).
  difficulty:
    label: Difficulty to play
    type: choice
    choices: [highest, easiest]
    default: highest
    help: >-
      Clearing a stage's highest difficulty for the first time also pays the
      first-clear Dragon Stones of the lower ones (checked in the game: a stage
      went from 0/3 to 3/3 with SUPER alone). "highest" plays SUPER, else Z-HARD,
      else HARD, else NORMAL: all stones of a stage in one clear, for more STA
      and harder battles. "easiest" plays the lowest listed difficulty: one
      stone per stage.
  sphere_x:
    label: "Battle: where to tap a ki sphere, x (0 = left, 1 = right)"
    type: number
    default: 0.5
    min: 0
    max: 1
  sphere_y:
    label: "Battle: where to tap a ki sphere, y (0 = top, 1 = bottom)"
    type: number
    default: 0.45
    min: 0
    max: 1
    help: A spot in the middle of the ki spheres, between the enemy and your team.
  tap_every:
    label: "Battle: seconds between taps"
    type: number
    default: 1.5
    min: 0.5
    max: 10
  move_x:
    label: "Map: where to tap to move, x"
    type: number
    default: 0.5
    min: 0
    max: 1
  move_y:
    label: "Map: where to tap to move, y"
    type: number
    default: 0.85
    min: 0
    max: 1
    help: Where you tap on the map to move on (the movement card or the button for it).
  empty_sagas:
    label: Stop after this many sagas in a row without a NEW stage
    type: number
    default: 4
    min: 1
    max: 50
    help: >-
      At the end of the series the wheel turns no further and the same saga opens
      again; sagas you already finished count too.
  max_scrolls:
    label: Swipes to look for a NEW stage, each way
    type: number
    default: 1
    min: 1
    max: 30
  act_policy:
    label: When ACT runs out
    type: choice
    choices: [wait, item, stone, stop]
    default: wait
    help: >-
      wait = let ACT regenerate, item = use ACT recovery items,
      stone = spend Dragon Stones (up to the limit below), stop = stop.
  act_wait_minutes:
    label: Minutes to wait for ACT to regenerate
    type: number
    default: 60
    min: 1
    max: 1440
  max_stone_refills:
    label: Max Dragon Stones spent on ACT per session
    type: number
    default: 0
    min: 0
    max: 50
  continue_after:
    label: Seconds of a still screen before tapping to continue
    type: number
    default: 6
    min: 2
    max: 120

settings:
  tick_interval: 1.0
  action_delay: 1.5
  stop_after_runs: $max_stages
  run_counter: stages_cleared
  ensure_foreground: true
  stuck:
    static_seconds: 180
    # Battles are played by the rules below, so a long silence means something
    # unexpected is on screen.
    idle_seconds: 300
    recovery:
      - key: BACK
      - wait: 3
    restart_after: 2
    max_restarts: 3

counters:
  stages_cleared:
    label: Stages cleared
    appears: stage_result
    rearm: start_button

# Colours the routine looks for (hue 0-179, saturation and value 0-255, as in OpenCV).
colors:
  path_arrow:
    description: >-
      The bright blue arrows where the path on the map forks (hue 99-104: the sea of some maps
      is a little lighter). The one nearest the screen centre is tapped: the game keeps the
      player there, and the arrows sit next to it.
    hsv_min: [99, 190, 170]
    hsv_max: [104, 255, 255]
    min_area: 0.001
    max_area: 0.03
    region: [0, 0.22, 1, 0.46]
    close: 2
    near: [0.5, 0.46]

templates:
  new_mark:
    level: required
    description: >-
      The "NEW" mark of an uncleared stage in the stage list. Tick "search the
      whole screen" so it is found on any row. Crop only the letters. It
      shimmers: a threshold of 0.75 finds it in every frame. If the stage does not open when the mark is tapped,
      set a tap point on the stage's row.
  stage_list:
    level: required
    description: >-
      Something that is only on the stage list of an area, e.g. its title bar.
      The routine only looks for NEW marks while this is on screen.
  difficulty_normal:
    level: required
    description: >-
      The NORMAL bar on a stage's difficulty screen (the first row, with the
      word NORMAL). The routine plays NEW stages on Normal.
  difficulty_hard:
    level: optional
    description: >-
      The HARD label of a stage's difficulty list. Quest stages have no NORMAL:
      their easiest difficulty is HARD, which the routine plays when NORMAL is
      not on the screen.
  difficulty_zhard:
    level: optional
    description: >-
      The Z-HARD label of a stage's difficulty list (red bar). With difficulty =
      highest it is played when there is no SUPER.
  difficulty_super:
    level: optional
    description: >-
      The SUPER label of a stage's difficulty list (purple bar). With difficulty =
      highest it is played first: it also pays the stones of the lower ones.
  start_button:
    level: required
    description: The "Start!" button on the team screen before a quest.
  battle_screen:
    level: required
    description: >-
      Something that is always on screen during a battle and nowhere else, e.g.
      the pause / menu button of the battle screen.
      Best the green ITEM button at the bottom right: it is in every battle (the BATTLE DETAILS button
      at the top right is replaced by MENU in some).
  stage_result:
    level: required
    description: >-
      Something on the results screen at the end of a stage, e.g. "Obtained
      Item" (counts the cleared stages).
  stage_clear:
    level: recommended
    description: The "Battle Results" title after each won battle of a stage.
  home_screen:
    level: optional
    description: >-
      The big START button of the home screen (only for "Where to start" =
      quest; the same template as in Dokkan Collect Rewards).
  menu_quest:
    level: optional
    description: >-
      "Quest Dokkan Story" in the menu behind START (only for "Where to start" =
      quest).
  chapter_wheel:
    level: optional
    description: >-
      The "TAP" marker with its two arrows above the selected chapter of the
      Quest chapter wheel (only for "Where to start" = quest). Not the saga
      wheel's: capture it on the chapter wheel, near-region.
  saga_wheel:
    level: recommended
    description: >-
      The "TAP" marker above the selected saga of a series' saga wheel (crop
      only "TAP" and its arrows, not the saga). Not "search the whole screen":
      the series wheel has one too, higher up.
  back_button:
    level: required
    description: The "<<<" back button at the bottom left of a stage list.
  map_screen:
    level: recommended
    description: >-
      Something only the map (the board you move on) shows while it waits for
      your move: the top edge of the middle orange move card, without its
      number and without the map behind it (colour mode). Not the MENU button
      (battles have it too: the move tap would open a character's details) and
      not the NORMAL label (it is see-through, so every map looks different).
      While it is visible the routine taps "Map: where to tap to move".
  ok_button:
    level: recommended
    description: An "OK" button. Search the whole screen, so it is found in any dialog.
  select_support:
    level: recommended
    description: The first entry of the "select a support" list before a quest.
  skip_button:
    level: recommended
    description: The "Skip" button of the story scenes that play on a first clear.
  cancel_button:
    level: recommended
    description: >-
      A "Cancel" / "No" button. Search the whole screen. Used to decline friend
      requests and to close the not-enough-ACT dialog.
  act_empty_dialog:
    level: recommended
    description: >-
      The title of the "not enough ACT" dialog. Strongly recommended, so that
      the farmer never presses a Dragon Stone button by accident.
  defeat_give_up:
    level: recommended
    description: >-
      The "Give up" / "No" button when your team is defeated and Dokkan offers a
      revive for Dragon Stones.
  error_retry:
    level: recommended
    description: The "Retry" button of connection error dialogs.
  friend_request:
    level: optional
    description: The title of the "send a friend request?" popup after a stage.
  close_button:
    level: optional
    description: The "Close" / "X" of popups (rewards, news).
  act_use_item:
    level: optional
    description: The "use ACT recovery item" button (only with ACT policy = item).
  act_use_stone:
    level: optional
    description: The "restore with Dragon Stone" button (only with ACT policy = stone).

rules:
  # --- Errors and dangerous dialogs first -----------------------------------
  - name: Connection error → Retry
    when: {visible: error_retry}
    do: [{tap: error_retry}]
    cooldown: 3

  - name: Defeat → give up and stop
    when: {visible: defeat_give_up, counter_at_least: {defeats: $retries}}
    do:
      - tap: defeat_give_up
      - screenshot: defeat
      - stop: Team was defeated after {stages_cleared} cleared stages. Use a stronger team for this stage.

  - name: Defeat → give up and try again
    when: {visible: defeat_give_up}
    do:
      - tap: defeat_give_up
      - count: defeats
      - notify: "Defeat #{defeats} (after {stages_cleared} cleared stages), trying again"
    cooldown: 5

  # --- ACT (stamina) ran out ---------------------------------------------------
  - name: Out of ACT → stop
    when: {visible: act_empty_dialog, option: {act_policy: stop}}
    do:
      - tap: cancel_button
      - stop: Out of ACT after {stages_cleared} cleared stages

  - name: Out of ACT → use item
    when: {visible: [act_empty_dialog, act_use_item], option: {act_policy: item}}
    do: [{tap: act_use_item}, {count: item_refills}]
    cooldown: 5

  - name: Out of ACT → use Dragon Stone
    when:
      visible: [act_empty_dialog, act_use_stone]
      option: {act_policy: stone}
      counter_below: {stone_refills: $max_stone_refills}
    do:
      - tap: act_use_stone
      - count: stone_refills
      - notify: "Spent a Dragon Stone on ACT ({stone_refills}/{max_stone_refills})"
    cooldown: 5

  - name: Out of ACT → wait
    when: {visible: act_empty_dialog}
    do:
      - tap: cancel_button
      - count: act_waits
      - notify: "Out of ACT after {stages_cleared} cleared stages, waiting {act_wait_minutes} min"
      - wait_minutes: $act_wait_minutes

  # --- Playing a stage -----------------------------------------------------------
  - name: Stage cleared → results
    when: {visible: stage_result}
    do: [{reset: defeats}, {reset: empty_sagas}, {reset: backs}, {tap_xy: [0.5, 0.5]}]
    cooldown: 3

  - name: Battle won → results
    when: {visible: stage_clear}
    do: [{tap_xy: [0.5, 0.5]}]
    cooldown: 3

  - name: Battle → tap a ki sphere
    when: {visible: battle_screen}
    do: [{reset: backs}, {tap_xy: [$sphere_x, $sphere_y]}]
    cooldown: $tap_every
    delay: 0.3

  - name: Skip story scene
    when: {visible: skip_button}
    do: [{tap: skip_button}]
    cooldown: 3

  # Where the path forks, blue arrows next to your character show the ways on (the
  # move cards turn grey). They point any of eight ways, so instead of one template per
  # direction the routine looks for their colour (see colors: path_arrow) and taps the
  # biggest arrow. Battles have blue ki spheres: hence not_visible: battle_screen.
  - name: Map → choose a path
    when:
      color_visible: path_arrow
      not_visible: [battle_screen, stage_list, start_button, saga_wheel, home_screen, menu_quest, chapter_wheel]
    do: [{tap_color: path_arrow}]
    cooldown: 3

  - name: Map → move
    when: {visible: map_screen, not_visible: battle_screen}
    do: [{reset: backs}, {tap_xy: [$move_x, $move_y]}]
    cooldown: 2

  - name: Decline friend request
    when: {visible: friend_request}
    do: [{tap: cancel_button}]
    cooldown: 3

  - name: Start quest
    when: {visible: start_button}
    do: [{tap: start_button}]
    cooldown: 5

  - name: Pick the first support
    when: {visible: select_support}
    do: [{tap: select_support}]
    cooldown: 4

  # --- Finding the next NEW stage ------------------------------------------------
  - name: Open a NEW stage
    when: {visible: [stage_list, new_mark]}
    do:
      - tap: new_mark
      - reset: scrolls_down
      - reset: scrolls_up
      - reset: misses
      - reset: backs
    cooldown: 4

  # Quest: Dokkan Story has chapters of areas instead of a saga wheel; an area with
  # uncleared stages carries a NEW mark in the area list (which has no MISSION button).
  - name: Open a NEW area
    when: {visible: new_mark, not_visible: stage_list}
    do: [{tap: new_mark}, {reset: misses}, {reset: backs}]
    cooldown: 4

  # Clearing the highest difficulty of a stage also pays the lower ones' first-clear
  # stones, so by default the highest listed difficulty is played (SUPER, else Z-HARD,
  # else HARD, else NORMAL); "easiest" plays the lowest one.
  - name: Pick Super
    when: {visible: difficulty_super, option: {difficulty: highest}}
    do: [{tap: difficulty_super}]
    cooldown: 4

  - name: Pick Z-Hard
    when:
      visible: difficulty_zhard
      not_visible: difficulty_super
      option: {difficulty: highest}
    do: [{tap: difficulty_zhard}]
    cooldown: 4

  - name: Pick Hard
    when:
      visible: difficulty_hard
      not_visible: [difficulty_super, difficulty_zhard]
      option: {difficulty: highest}
    do: [{tap: difficulty_hard}]
    cooldown: 4

  - name: Pick Normal
    when:
      visible: difficulty_normal
      not_visible: [difficulty_super, difficulty_zhard, difficulty_hard]
      option: {difficulty: highest}
    do: [{tap: difficulty_normal}]
    cooldown: 4

  - name: Pick Normal (easiest)
    when: {visible: difficulty_normal, option: {difficulty: easiest}}
    do: [{tap: difficulty_normal}]
    cooldown: 4

  - name: Pick Hard (easiest; Quest stages have no Normal)
    when:
      visible: difficulty_hard
      not_visible: difficulty_normal
      option: {difficulty: easiest}
    do: [{tap: difficulty_hard}]
    cooldown: 4

  # The NEW label shimmers: one frame without it is no reason to scroll. Look three
  # times first (misses), and only then swipe.
  - name: No NEW mark on screen, look again
    when:
      visible: stage_list
      not_visible: new_mark
      counter_below: {misses: 3}
    do: [{count: misses}]
    cooldown: 1

  # Swiping up scrolls the list down. At the end of the list a swipe changes
  # nothing: after a few of those the engine pauses this rule, and the next one
  # looks the other way.
  - name: Look further down for a NEW stage
    when:
      visible: stage_list
      not_visible: new_mark
      counter_at_least: {misses: 3}
      counter_below: {scrolls_down: $max_scrolls}
    do:
      - swipe: {from: [0.5, 0.75], to: [0.5, 0.4], ms: 500}
      - count: scrolls_down
      - reset: misses
    cooldown: 2

  - name: Look further up for a NEW stage
    when:
      visible: stage_list
      not_visible: new_mark
      counter_at_least: {misses: 3}
      counter_below: {scrolls_up: $max_scrolls}
    do:
      - swipe: {from: [0.5, 0.4], to: [0.5, 0.75], ms: 500}
      - wait: 1
      - swipe: {from: [0.5, 0.4], to: [0.5, 0.75], ms: 500}
      - count: scrolls_up
      - reset: misses
    cooldown: 2

  # --- On to the next saga ---------------------------------------------------------
  - name: Series done → stop
    when:
      visible: stage_list
      not_visible: new_mark
      counter_at_least: {misses: 3, empty_sagas: $empty_sagas}
    do:
      - screenshot: story_done
      - stop: >-
          {empty_sagas} sagas in a row had no NEW stage: this series is done
          ({stages_cleared} stages cleared). Open the next series and start again.

  - name: Saga done → back to the saga wheel
    when:
      visible: [stage_list, back_button]
      not_visible: new_mark
      counter_at_least: {misses: 3}
    do:
      - count: empty_sagas
      - count: turn_wheel
      - reset: misses
      - reset: scrolls_down
      - reset: scrolls_up
      - tap: back_button
    cooldown: 3

  # A short swipe down turns the wheel by one saga, towards the later ones.
  - name: Saga wheel → next saga
    when: {visible: saga_wheel, counter_at_least: {turn_wheel: 1}}
    do:
      - swipe: {from: [0.5, 0.6], to: [0.5, 0.7], ms: 400}
      - reset: turn_wheel
    cooldown: 2

  - name: Saga wheel → open the saga
    when: {visible: saga_wheel}
    do: [{tap_xy: [0.5, 0.7]}]
    cooldown: 4

  # --- Dialogs and fallbacks -------------------------------------------------------
  - name: Close popup
    when: {visible: close_button}
    do: [{tap: close_button}]
    cooldown: 2

  - name: Confirm (OK)
    when: {visible: ok_button, not_visible: [act_empty_dialog, defeat_give_up]}
    do: [{tap: ok_button}]
    cooldown: 2

  # Quest: an area's stage list has no MISSION button, so there is no stage_list: when it
  # (or the area list) has no NEW mark left, Back leads to the list before. Four Backs in
  # a row, without a stage, a battle or a map move in between, mean nothing is left.
  - name: Nothing left → stop
    when:
      visible: back_button
      not_visible: [stage_list, start_button, saga_wheel, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      counter_at_least: {backs: 4}
    do:
      - screenshot: story_done
      - stop: >-
          No NEW stage or area left here ({stages_cleared} stages cleared). Open the
          next chapter or series and start again.

  # --- Quest: from the home screen to a chapter's areas ------------------------------
  - name: Home → START
    when: {visible: home_screen, option: {start_in: quest}}
    do: [{tap: home_screen}]
    cooldown: 6

  - name: Menu → Quest Dokkan Story
    when: {visible: menu_quest, option: {start_in: quest}}
    do: [{tap: menu_quest}]
    cooldown: 5

  - name: Chapter wheel → turn it
    when:
      visible: chapter_wheel
      option: {start_in: quest}
      counter_below: {turns: $chapter_turns}
    do:
      - swipe: {from: [0.5, 0.6], to: [0.5, 0.7], ms: 400}
      - count: turns
    cooldown: 3

  # Opening counts like a Back: when its chapter has nothing left, the routine returns
  # here and the "Nothing left" rule above ends the run after a few rounds.
  - name: Chapter wheel → open the chapter
    when:
      visible: chapter_wheel
      option: {start_in: quest}
      counter_at_least: {turns: $chapter_turns}
    do: [{count: backs}, {tap_xy: [0.5, 0.5]}]
    cooldown: 5

  # A tap that lands on a character (in battle, or while a battle starts) opens its
  # details, a page with only a "<<<" button: Back closes it. Only on a screen that has
  # been still for a few seconds and is no difficulty list: while a screen is loading,
  # its "<<<" is all there is to see, and Back would close the stage just opened.
  - name: Close a details page
    when:
      visible: back_button
      not_visible: [stage_list, start_button, saga_wheel, chapter_wheel, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      static_for: 4
    do: [{count: backs}, {key: BACK}]
    cooldown: 3

  - name: Tap to continue
    when:
      static_for: $continue_after
      not_visible: [act_empty_dialog, defeat_give_up, stage_list, saga_wheel, chapter_wheel]
    do: [{tap_xy: [0.5, 0.15]}]
    cooldown: 4

  # The results screen of a stage has a popup ("... were cleared at the same time") that
  # hides its label, and the light behind it never stops moving, so the still-screen rule
  # above never fires. After 10 quiet seconds on a screen none of the rules knows, a tap
  # near the top (away from the buttons of dialogs) dismisses it.
  - name: Nothing recognised → tap the top
    when:
      idle_for: 10
      not_visible: [act_empty_dialog, defeat_give_up, battle_screen, map_screen, stage_list, start_button, error_retry, saga_wheel, chapter_wheel, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
    do: [{tap_xy: [0.5, 0.15]}]
    cooldown: 4

# Dokkan Clear New Stages: plays stages you have not cleared yet, for their
# first-clear rewards (Dragon Stones).
#
# Dokkan's Auto Mode only works on stages you already cleared, so this routine
# plays them itself, the simple way: on the map it taps where you move, in
# battle it keeps tapping one spot of the ki sphere board. That is enough for
# easy stages (Normal and Hard Quest stages of early areas) with a strong team;
# it is not a battle strategy. Watch the first stage in the Screen tab.
#
# How to use it: open the stage list of one Quest area in Dokkan (the list
# where uncleared stages carry a "NEW" mark), capture the templates below,
# then select this routine on the Farm tab and press Start. The routine opens
# the first NEW stage it sees, picks NORMAL, plays it, and continues with the
# next one. When the list has no NEW mark left (it scrolls down and up to
# look), it stops. A NEW stage was never cleared, so its Normal always has a
# Dragon Stone; the harder difficulties (the "1/2" on a CLEARED! stage) stay
# for you.
#
# Templates are shared with the other routines: buttons you captured for Dokkan
# Auto Farm (OK, Start!, Cancel, ...) work here too.
#
# Full reference: docs/ROUTINES.md
name: Dokkan Clear New Stages
description: >-
  Plays the stages of one Quest area you have not cleared yet (the "NEW" ones)
  for their first-clear Dragon Stones: opens each NEW stage on Normal, taps
  through the map and the battles, and stops when none is left.
version: 1

options:
  max_stages:
    label: Stop after N cleared stages (0 = when none is left)
    type: number
    default: 0
    min: 0
  retries:
    label: Tries again after a defeat (0 = stop at the first defeat)
    type: number
    default: 1
    min: 0
    max: 20
    help: >-
      The farmer always taps "Give up", never a paid revive. The count starts
      again after each cleared stage.
  difficulty:
    label: Difficulty to play
    type: choice
    choices: [highest, easiest]
    default: highest
    help: >-
      Clearing a stage's highest difficulty for the first time also pays the
      first-clear Dragon Stones of the lower ones (checked in the game: a stage
      went from 0/3 to 3/3 with SUPER alone). "highest" plays SUPER, else Z-HARD,
      else HARD, else NORMAL: all stones of a stage in one clear, for more STA
      and harder battles. "easiest" plays the lowest listed difficulty: one
      stone per stage.
  sphere_x:
    label: "Battle: where to tap a ki sphere, x (0 = left, 1 = right)"
    type: number
    default: 0.5
    min: 0
    max: 1
  sphere_y:
    label: "Battle: where to tap a ki sphere, y (0 = top, 1 = bottom)"
    type: number
    default: 0.45
    min: 0
    max: 1
    help: A spot in the middle of the ki spheres, between the enemy and your team.
  tap_every:
    label: "Battle: seconds between taps"
    type: number
    default: 1.5
    min: 0.5
    max: 10
  move_x:
    label: "Map: where to tap to move, x"
    type: number
    default: 0.5
    min: 0
    max: 1
  move_y:
    label: "Map: where to tap to move, y"
    type: number
    default: 0.85
    min: 0
    max: 1
    help: Where you tap on the map to move on (the movement card or the button for it).
  max_scrolls:
    label: Swipes to look for a NEW stage, each way
    type: number
    default: 6
    min: 1
    max: 30
  act_policy:
    label: When ACT runs out
    type: choice
    choices: [wait, item, meat, stone, stop]
    default: meat
    help: >-
      wait = let ACT regenerate, item = use ACT recovery items,
      meat = refill with Aged Meat through the "Restore STA" dialog (its "with Item" row,
      one piece at a time, never a Dragon Stone; needs restore_sta, restore_with_item),
      stone = spend Dragon Stones (up to the limit below), stop = stop.
  act_wait_minutes:
    label: Minutes to wait for ACT to regenerate
    type: number
    default: 60
    min: 1
    max: 1440
  quick_finish:
    label: Event lists - stop when the top of the list has no NEW stage
    type: choice
    choices: ["yes", "no"]
    default: "yes"
    help: >-
      An event's newest stage is always at the top of its list, so if the list (as it opens)
      shows no NEW mark the event is done: no need to scroll up and down to be sure. Only for
      event lists (the event_stage_row template); no = always scroll to look.
  next_event:
    label: When an event is finished, go on with the next one of the Dragon Stone Navigator
    type: choice
    choices: ["no", "yes"]
    default: "no"
    help: >-
      yes = after an event has no NEW stage left (or a stage of it needs a team you do not have)
      and its missions are dealt with, open the Dragon Stone Navigator (the orange stone button
      of the event screens, "Missions Included" OFF) and play the next event of its list; it
      stops when the list has nothing usable left. Needs the templates navigator_open and
      navigator_title (and event_stage_row, event_mission, mission_dialog,
      mission_accept_all for the missions).
  max_events:
    label: Events to play with "next event" (a limit, not a goal)
    type: number
    default: 20
    min: 1
    max: 100
  claim_missions:
    label: Accept the event's mission rewards before stopping
    type: choice
    choices: ["no", "yes"]
    default: "no"
    help: >-
      yes = when no NEW stage is left, open the MISSION screen of the stage list and accept the
      rewards that are ready (events pay Dragon Stones for e.g. clearing every stage). Needs the
      templates event_mission, mission_dialog and mission_accept_all.
  max_meat_refills:
    label: Max Aged Meat refills per session (ACT policy = meat)
    type: number
    default: 10
    min: 1
    max: 50
  max_stone_refills:
    label: Max Dragon Stones spent on ACT per session
    type: number
    default: 0
    min: 0
    max: 50
  continue_after:
    label: Seconds of a still screen before tapping to continue
    type: number
    default: 6
    min: 2
    max: 120

settings:
  tick_interval: 1.0
  action_delay: 1.5
  stop_after_runs: $max_stages
  run_counter: stages_cleared
  ensure_foreground: true
  stuck:
    static_seconds: 180
    # Battles are played by the rules below, so a long silence means something
    # unexpected is on screen.
    idle_seconds: 300
    recovery:
      - key: BACK
      - wait: 3
    restart_after: 2
    max_restarts: 3

counters:
  stages_cleared:
    label: Stages cleared
    appears: stage_result
    rearm: start_button

# Colours the routine looks for (hue 0-179, saturation and value 0-255, as in OpenCV).
colors:
  path_arrow:
    description: >-
      The bright blue arrows where the path on the map forks (hue 99-104: the sea of some maps
      is a little lighter). The one nearest the screen centre is tapped: the game keeps the
      player there, and the arrows sit next to it.
    hsv_min: [99, 190, 170]
    hsv_max: [104, 255, 255]
    min_area: 0.001
    max_area: 0.03
    region: [0, 0.22, 1, 0.46]
    close: 2
    near: [0.5, 0.46]

templates:
  new_mark:
    level: required
    description: >-
      The "NEW" mark of an uncleared stage in the stage list. Tick "search the
      whole screen" so it is found on any row. Crop only the letters. It
      shimmers: a threshold of 0.75 finds it in every frame. If the stage does not open when the mark is tapped,
      set a tap point on the stage's row.
  stage_list:
    level: required
    description: >-
      Something that is only on the stage list of an area, e.g. its title bar.
      The routine only looks for NEW marks while this is on screen.
  difficulty_normal:
    level: required
    description: >-
      The NORMAL bar on a stage's difficulty screen (the first row, with the
      word NORMAL). The routine plays NEW stages on Normal.
  difficulty_hard:
    level: optional
    description: >-
      The HARD label of a stage's difficulty list. Quest stages have no NORMAL:
      their easiest difficulty is HARD, which the routine plays when NORMAL is
      not on the screen.
  difficulty_zhard:
    level: optional
    description: >-
      The Z-HARD label of a stage's difficulty list (red bar). With difficulty =
      highest it is played when there is no SUPER.
  difficulty_super:
    level: optional
    description: >-
      The SUPER label of a stage's difficulty list (purple bar). With difficulty =
      highest it is played first: it also pays the stones of the lower ones.
  event_stage_row:
    level: optional
    description: >-
      The "Clear Reward / Featured Reward" headings of a stage row on an EVENT's stage list
      (events have no MISSION button there, so stage_list never matches). Tick "search the
      whole screen": the rows scroll. Used to find NEW stages of events, e.g. the ones the
      Dragon Stone Navigator opens.
  start_button:
    level: required
    description: The "Start!" button on the team screen before a quest.
  battle_screen:
    level: required
    description: >-
      Something that is always on screen during a battle and nowhere else, e.g.
      the pause / menu button of the battle screen.
      Best the green ITEM button at the bottom right: it is in every battle (the BATTLE DETAILS button
      at the top right is replaced by MENU in some).
  stage_result:
    level: required
    description: >-
      Something on the results screen at the end of a stage, e.g. "Obtained
      Item" (counts the cleared stages). Its light rays never stop moving, so
      "tap to continue" would wait forever: the routine taps it away at once.
  stage_clear:
    level: recommended
    description: The "Battle Results" title after each won battle of a stage.
  map_screen:
    level: recommended
    description: >-
      Something only the map (the board you move on) shows while it waits for
      your move: the top edge of the middle orange move card, without its
      number and without the map behind it (colour mode). Not the MENU button
      (battles have it too: the move tap would open a character's details) and
      not the NORMAL label (it is see-through, so every map looks different).
      While it is visible the routine taps "Map: where to tap to move".
  ok_button:
    level: recommended
    description: An "OK" button. Search the whole screen, so it is found in any dialog.
  select_support:
    level: recommended
    description: The first entry of the "select a support" list before a quest.
  skip_button:
    level: recommended
    description: The "Skip" button of the story scenes that play on a first clear.
  cancel_button:
    level: recommended
    description: >-
      A "Cancel" / "No" button. Search the whole screen. Used to decline friend
      requests and to close the not-enough-ACT dialog.
  act_empty_dialog:
    level: recommended
    description: >-
      The title of the "not enough ACT" dialog. Strongly recommended, so that
      the farmer never presses a Dragon Stone button by accident.
  defeat_give_up:
    level: recommended
    description: >-
      The "Give up" / "No" button when your team is defeated and Dokkan offers a
      revive for Dragon Stones.
  event_mission:
    level: optional
    description: >-
      The MISSION button at the bottom right of a stage list (only for "Accept the event's
      mission rewards").
  mission_dialog:
    level: optional
    description: The title "Mission(s)" of the mission list (only for the mission rewards).
  mission_accept_all:
    level: optional
    description: >-
      The orange "Accept all" button of the mission list (orange while something is ready, grey
      otherwise): colour mode, "search the whole screen" (only for the mission rewards).
  navigator_open:
    level: optional
    description: >-
      The orange Dragon Stone button at the bottom of the event screens and stage lists: it opens
      the Dragon Stone Navigator (only for "next event").
  navigator_title:
    level: optional
    description: >-
      The title "Dragon Stone Navigator" of its dialog (only for "next event").
  menu_event:
    level: optional
    description: >-
      The "Event" entry of the menu behind the home screen's START button (only for "next event": the
      way back to the Dragon Stone Navigator when the routine got lost: Home, START, Event).
  restore_sta:
    level: optional
    description: >-
      The title "Restore STA" of the stamina refill dialogs (only for ACT policy = meat).
  restore_with_item:
    level: optional
    description: >-
      The heading "Restore STA with Item" of the first refill dialog (not the Dragon Stone
      row; only for ACT policy = meat). The routine taps that row's Select button.
  restore_items_to_use:
    level: optional
    description: '"Item(s) to Use" of the second refill dialog (only for ACT policy = meat).'
  requirement_not_met:
    level: recommended
    description: >-
      The title "Requirement Not Met" of the dialog that says your team breaks a stage's
      restriction (e.g. only non-PHY units). Without it the routine would press Start and OK
      over and over.
  error_retry:
    level: recommended
    description: The "Retry" button of connection error dialogs.
  friend_request:
    level: optional
    description: The title of the "send a friend request?" popup after a stage.
  home_screen:
    level: optional
    description: >-
      Something only the home screen shows. The home screen has blue buttons that look like
      the path arrows, so the routine never looks for arrows while it is on screen.
  back_button:
    level: optional
    description: >-
      The "<<<" back button at the bottom left. A tap on a character opens its
      details with only this button: the routine then presses Back.
  close_button:
    level: optional
    description: The "Close" / "X" of popups (rewards, news).
  act_use_item:
    level: optional
    description: The "use ACT recovery item" button (only with ACT policy = item).
  act_use_stone:
    level: optional
    description: The "restore with Dragon Stone" button (only with ACT policy = stone).

rules:
  # --- Errors and dangerous dialogs first -----------------------------------
  - name: Connection error → Retry
    when: {visible: error_retry}
    do: [{reset: lost}, {tap: error_retry}]
    cooldown: 3

  # A stage that needs a team you do not have: with "next event" the event is given up, and
  # the routine backs out of the team page and goes on with the next event.
  - name: Team not allowed → give up this event
    when:
      visible: [requirement_not_met, ok_button]
      not_visible: [restore_sta, restore_items_to_use]
      option: {next_event: "yes"}
    do: [{reset: lost}, {reset: start_tries}, {tap: ok_button}, {count: blocked}]
    cooldown: 3

  - name: Team not allowed → stop
    when:
      visible: [requirement_not_met, ok_button]
      not_visible: [restore_sta, restore_items_to_use]
      option: {next_event: "no"}
    do:
      - reset: lost
      - tap: ok_button
      - screenshot: requirement_not_met
      - stop: "This stage restricts the team (see the dialog): no cleared stages from here. Change the team and start again."

  - name: Defeat → give up and stop
    when: {visible: defeat_give_up, counter_at_least: {defeats: $retries}}
    do:
      - reset: lost
      - tap: defeat_give_up
      - screenshot: defeat
      - stop: Team was defeated after {stages_cleared} cleared stages. Use a stronger team for this stage.

  - name: Defeat → give up and try again
    when: {visible: defeat_give_up}
    do:
      - reset: lost
      - tap: defeat_give_up
      - count: defeats
      - notify: "Defeat #{defeats} (after {stages_cleared} cleared stages), trying again"
    cooldown: 5

  # --- ACT (stamina) ran out ---------------------------------------------------
  # Stamina refill with Aged Meat (the "Restore STA" dialog of Dokkan: a Dragon Stone row and
  # an "with Item" row). Only the item row is ever tapped.
  - name: Out of stamina → Aged Meat limit reached, stop
    when:
      visible: [restore_sta, restore_with_item, cancel_button]
      option: {act_policy: meat}
      counter_at_least: {meat_refills: $max_meat_refills}
    do:
      - reset: lost
      - tap: cancel_button
      - stop: "Stamina is low and {meat_refills} Aged Meat refills were used: stopping after {stages_cleared} cleared stages."

  - name: Out of stamina → use an Aged Meat
    when:
      visible: [restore_sta, restore_with_item]
      not_visible: restore_items_to_use
      option: {act_policy: meat}
      counter_below: {meat_refills: $max_meat_refills}
    do: [{reset: lost}, {count: meat_refills}, {reset: minus}, {tap_xy: [0.82, 0.606]}]
    cooldown: 4

  # The dialog suggests two pieces: use one.
  - name: Out of stamina → one piece only
    when:
      visible: [restore_sta, ok_button]
      option: {act_policy: meat}
      counter_below: {minus: 1}
    do: [{reset: lost}, {count: minus}, {tap_xy: [0.305, 0.542]}]
    cooldown: 2

  - name: Out of stamina → stop
    when:
      visible: [restore_sta, restore_with_item, cancel_button]
      option: {act_policy: stop}
    do:
      - reset: lost
      - tap: cancel_button
      - stop: Out of stamina after {stages_cleared} cleared stages

  - name: Out of ACT → stop
    when: {visible: act_empty_dialog, option: {act_policy: stop}}
    do:
      - reset: lost
      - tap: cancel_button
      - stop: Out of ACT after {stages_cleared} cleared stages

  - name: Out of ACT → use item
    when: {visible: [act_empty_dialog, act_use_item], option: {act_policy: item}}
    do: [{reset: lost}, {tap: act_use_item}, {count: item_refills}]
    cooldown: 5

  - name: Out of ACT → use Dragon Stone
    when:
      visible: [act_empty_dialog, act_use_stone]
      option: {act_policy: stone}
      counter_below: {stone_refills: $max_stone_refills}
    do:
      - reset: lost
      - tap: act_use_stone
      - count: stone_refills
      - notify: "Spent a Dragon Stone on ACT ({stone_refills}/{max_stone_refills})"
    cooldown: 5

  - name: Out of ACT → wait
    when: {visible: act_empty_dialog}
    do:
      - reset: lost
      - tap: cancel_button
      - count: act_waits
      - notify: "Out of ACT after {stages_cleared} cleared stages, waiting {act_wait_minutes} min"
      - wait_minutes: $act_wait_minutes

  # --- Playing a stage -----------------------------------------------------------
  - name: Stage cleared → results
    when: {visible: stage_result}
    do: [{reset: lost}, {reset: idle_events}, {reset: start_tries}, {reset: in_stage}, {reset: defeats}, {count: ev_stages}, {tap_xy: [0.5, 0.5]}]
    cooldown: 3

  - name: Battle won → results
    when: {visible: stage_clear}
    do: [{reset: lost}, {tap_xy: [0.5, 0.5]}]
    cooldown: 3

  - name: Battle → tap a ki sphere
    when: {visible: battle_screen}
    do: [{reset: lost}, {reset: start_tries}, {count: in_stage}, {tap_xy: [$sphere_x, $sphere_y]}]
    cooldown: $tap_every
    delay: 0.3

  - name: Skip story scene
    when: {visible: skip_button}
    do: [{reset: lost}, {tap: skip_button}]
    cooldown: 3

  # Where the path forks, blue arrows next to your character show the ways on (the
  # move cards turn grey). They point any of eight ways, so instead of one template per
  # direction the routine looks for their colour (see colors: path_arrow) and taps the
  # biggest arrow. Battles have blue ki spheres: hence not_visible: battle_screen.
  # Only inside a stage (in_stage: Start quest, the map and the battle count it): the home
  # screen, the START menu and the story wheels have blue buttons too.
  - name: Map → choose a path
    when:
      color_visible: path_arrow
      not_visible: [battle_screen, stage_list, event_stage_row, start_button, home_screen, menu_event, navigator_title]
      counter_at_least: {in_stage: 1}
    do: [{reset: lost}, {tap_color: path_arrow}]
    cooldown: 3

  - name: Map → move
    when: {visible: map_screen, not_visible: battle_screen}
    do: [{reset: lost}, {reset: start_tries}, {count: in_stage}, {tap_xy: [$move_x, $move_y]}]
    cooldown: 2

  - name: Decline friend request
    when: {visible: friend_request}
    do: [{reset: lost}, {tap: cancel_button}]
    cooldown: 3

  # Failsafe: Start! was pressed four times and no map or battle followed (a dialog we do not
  # know blocks the stage, a team restriction, a full box ...): give up this event.
  - name: Stage will not start → give up this event
    when:
      visible: start_button
      counter_at_least: {start_tries: 4}
      option: {next_event: "yes"}
    do: [{reset: lost}, {reset: start_tries}, {count: blocked}, {key: BACK}]
    cooldown: 3

  - name: Stage will not start → stop
    when:
      visible: start_button
      counter_at_least: {start_tries: 4}
      option: {next_event: "no"}
    do:
      - screenshot: start_blocked
      - stop: "The stage does not start (see the 'start_blocked' screenshot): a dialog or a team restriction is in the way."

  - name: Start quest
    when: {visible: start_button, counter_below: {blocked: 1}}
    do: [{reset: lost}, {count: in_stage}, {count: start_tries}, {tap: start_button}]
    cooldown: 5

  - name: Pick the first support
    when: {visible: select_support, counter_below: {blocked: 1}}
    do: [{reset: lost}, {tap: select_support}]
    cooldown: 4

  # After a blocked stage ("next event"): back out of the team / difficulty pages to the list.
  - name: Blocked stage → back to the list
    when:
      visible: back_button
      not_visible: [stage_list, event_stage_row, navigator_title, requirement_not_met]
      counter_at_least: {blocked: 1}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap: back_button}]
    cooldown: 3

  # Enough events: stop before the next event's first stage starts.
  # A whole pass over the navigator gave nothing (other teams needed, no NEW stage left):
  # stop with that message instead of going round until max_events.
  - name: Next event → nothing playable, stop
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      counter_at_least: {idle_events: 13}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - screenshot: nothing_playable
      - notify: "Dragon Stone farm: no event is playable with this team any more ({runs} stages cleared)."
      - stop: "No playable event left: 13 events in a row gave no stage (they need other teams or have no NEW stage). {runs} stages cleared."

  - name: Next event → limit reached, stop
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      counter_at_least: {events_done: $max_events}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - stop: "{events_done} events done ({stages_cleared} stages cleared)."

  # --- Finding the next NEW stage ------------------------------------------------
  - name: Open a NEW stage
    when:
      visible: new_mark
      any_visible: [stage_list, event_stage_row]
      counter_below: {blocked: 1}
    do: [{reset: lost}, {reset: in_stage}, {tap: new_mark}, {reset: scrolls_down}, {reset: scrolls_up}, {reset: misses}, {reset: skip_scroll}]
    cooldown: 4

  # Clearing the highest difficulty of a stage also pays the lower ones' first-clear
  # stones, so by default the highest listed difficulty is played (SUPER, else Z-HARD,
  # else HARD, else NORMAL); "easiest" plays the lowest one.
  - name: Pick Super
    when:
      visible: difficulty_super
      counter_below: {blocked: 1}
      option: {difficulty: highest}
    do: [{reset: lost}, {tap: difficulty_super}]
    cooldown: 4

  - name: Pick Z-Hard
    when:
      visible: difficulty_zhard
      not_visible: difficulty_super
      counter_below: {blocked: 1}
      option: {difficulty: highest}
    do: [{reset: lost}, {tap: difficulty_zhard}]
    cooldown: 4

  - name: Pick Hard
    when:
      visible: difficulty_hard
      not_visible: [difficulty_super, difficulty_zhard]
      counter_below: {blocked: 1}
      option: {difficulty: highest}
    do: [{reset: lost}, {tap: difficulty_hard}]
    cooldown: 4

  - name: Pick Normal
    when:
      visible: difficulty_normal
      not_visible: [difficulty_super, difficulty_zhard, difficulty_hard]
      counter_below: {blocked: 1}
      option: {difficulty: highest}
    do: [{reset: lost}, {tap: difficulty_normal}]
    cooldown: 4

  - name: Pick Normal (easiest)
    when:
      visible: difficulty_normal
      counter_below: {blocked: 1}
      option: {difficulty: easiest}
    do: [{reset: lost}, {tap: difficulty_normal}]
    cooldown: 4

  - name: Pick Hard (easiest; Quest stages have no Normal)
    when:
      visible: difficulty_hard
      not_visible: difficulty_normal
      counter_below: {blocked: 1}
      option: {difficulty: easiest}
    do: [{reset: lost}, {tap: difficulty_hard}]
    cooldown: 4

  # The NEW label shimmers: one frame without it is no reason to scroll. Look three
  # times first (misses), and only then swipe.
  - name: No NEW mark on screen, look again
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: new_mark
      counter_below: {misses: 3}
    do: [{reset: lost}, {count: misses}]
    cooldown: 1

  # An event's newest stage is at the top of its list: no NEW mark there (before any swipe)
  # means the event is finished, so skip the scrolling.
  - name: Event list without NEW at the top → no scrolling
    when:
      visible: event_stage_row
      not_visible: new_mark
      counter_at_least: {misses: 3}
      counter_below: {scrolls_down: 1, scrolls_up: 1, skip_scroll: 1}
      option: {quick_finish: "yes"}
    do: [{reset: lost}, {count: skip_scroll}]
    cooldown: 1

  # Swiping up scrolls the list down. At the end of the list a swipe changes
  # nothing: after a few of those the engine pauses this rule, and the next one
  # looks the other way.
  - name: Look further down for a NEW stage
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: new_mark
      counter_at_least: {misses: 3}
      counter_below: {scrolls_down: $max_scrolls, skip_scroll: 1}
    do:
      - reset: lost
      - swipe: {from: [0.5, 0.75], to: [0.5, 0.4], ms: 500}
      - count: scrolls_down
      - reset: misses
    cooldown: 2

  - name: Look further up for a NEW stage
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: new_mark
      counter_at_least: {misses: 3}
      counter_below: {scrolls_up: $max_scrolls, skip_scroll: 1}
    do:
      - reset: lost
      - swipe: {from: [0.5, 0.4], to: [0.5, 0.75], ms: 500}
      - wait: 1
      - swipe: {from: [0.5, 0.4], to: [0.5, 0.75], ms: 500}
      - count: scrolls_up
      - reset: misses
    cooldown: 2

  # Before stopping: the event's missions (e.g. "clear every stage") pay Dragon Stones.
  - name: Missions → open
    when:
      visible: event_mission
      any_visible: [stage_list, event_stage_row]
      not_visible: [new_mark, mission_dialog]
      counter_at_least: {misses: 3}
      counter_below: {mission_opens: 1}
      option: {claim_missions: "yes"}
    do: [{reset: lost}, {count: mission_opens}, {tap: event_mission}]
    cooldown: 4

  - name: Missions → open (event given up)
    when:
      visible: event_mission
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      counter_at_least: {blocked: 1}
      counter_below: {mission_opens: 1}
      option: {claim_missions: "yes", next_event: "yes"}
    do: [{reset: lost}, {count: mission_opens}, {tap: event_mission}]
    cooldown: 4

  - name: Missions → skipped (claiming is off)
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: [new_mark, mission_dialog]
      counter_at_least: {misses: 3}
      counter_below: {claimed: 1}
      option: {claim_missions: "no", next_event: "yes"}
    do: [{reset: lost}, {count: claimed}]
    cooldown: 1

  - name: Missions → skipped (event given up, claiming is off)
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      counter_at_least: {blocked: 1}
      counter_below: {claimed: 1}
      option: {claim_missions: "no", next_event: "yes"}
    do: [{reset: lost}, {count: claimed}]
    cooldown: 1

  # Some event pages have no MISSION button at all: nothing to claim there.
  - name: Missions → no button here, skip
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: [event_mission, mission_dialog, new_mark]
      counter_at_least: {misses: 3}
      counter_below: {claimed: 1, mission_opens: 1}
      option: {claim_missions: "yes", next_event: "yes"}
    do: [{reset: lost}, {count: claimed}]
    cooldown: 2

  - name: Missions → no button here, skip (event given up)
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: [event_mission, mission_dialog]
      counter_at_least: {blocked: 1}
      counter_below: {claimed: 1, mission_opens: 1}
      option: {claim_missions: "yes", next_event: "yes"}
    do: [{reset: lost}, {count: claimed}]
    cooldown: 2

  - name: Missions → accept all
    when:
      visible: [mission_dialog, mission_accept_all]
      counter_at_least: {mission_opens: 1}
      counter_below: {accepts: 1}
    do: [{reset: lost}, {count: accepts}, {tap: mission_accept_all}]
    cooldown: 4

  # "Accept all" is grey when nothing is ready.
  - name: Missions → nothing to accept
    when:
      visible: [mission_dialog, cancel_button]
      not_visible: mission_accept_all
      counter_at_least: {mission_opens: 1}
      counter_below: {accepts: 1}
    do: [{reset: lost}, {count: accepts}, {count: claimed}, {tap: cancel_button}]
    cooldown: 4

  - name: Missions → close the list
    when:
      visible: [mission_dialog, cancel_button]
      counter_at_least: {accepts: 1}
    do: [{reset: lost}, {count: claimed}, {tap: cancel_button}]
    cooldown: 4

  # --- "Next event": the list is done, go on with the Dragon Stone Navigator --------------
  - name: Event finished → next event
    when:
      visible: navigator_open
      any_visible: [stage_list, event_stage_row]
      not_visible: [new_mark, mission_dialog]
      counter_at_least: {misses: 3, claimed: 1, ev_stages: 1}
      counter_below: {blocked: 1, events_done: $max_events}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - count: events_done
      - reset: ev_stages
      - reset: claimed
      - reset: accepts
      - reset: mission_opens
      - reset: misses
      - reset: scrolls_down
      - reset: scrolls_up
      - reset: skip_scroll
      - reset: nav_page
      - tap: navigator_open
    cooldown: 4

  # Nothing was cleared in it: the event stays in the navigator, so try the next entry.
  - name: Event without progress → next entry
    when:
      visible: navigator_open
      any_visible: [stage_list, event_stage_row]
      not_visible: [new_mark, mission_dialog]
      counter_at_least: {misses: 3, claimed: 1}
      counter_below: {blocked: 1, ev_stages: 1, events_done: $max_events}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - count: events_done
      - count: idle_events
      - reset: ev_stages
      - reset: claimed
      - reset: accepts
      - reset: mission_opens
      - reset: misses
      - reset: scrolls_down
      - reset: scrolls_up
      - reset: skip_scroll
      - count: nav_index
      - reset: nav_page
      - tap: navigator_open
    cooldown: 4

  - name: Event given up → next entry
    when:
      visible: navigator_open
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      counter_at_least: {blocked: 1, claimed: 1}
      counter_below: {events_done: $max_events}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - count: events_done
      - count: idle_events
      - reset: ev_stages
      - reset: claimed
      - reset: accepts
      - reset: mission_opens
      - reset: misses
      - reset: scrolls_down
      - reset: scrolls_up
      - reset: skip_scroll
      - reset: blocked
      - count: nav_index
      - reset: nav_page
      - tap: navigator_open
    cooldown: 4

  # Failsafe: the list has not changed for 90 s and no rule got anywhere (a missing template,
  # a button that does nothing): give this event up and go on.
  - name: Event list stalled → next entry
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: mission_dialog
      static_for: 90
      counter_below: {events_done: $max_events}
      option: {next_event: "yes"}
    do:
      - count: events_done
      - count: idle_events
      - reset: ev_stages
      - reset: claimed
      - reset: accepts
      - reset: mission_opens
      - reset: misses
      - reset: scrolls_down
      - reset: scrolls_up
      - reset: skip_scroll
      - reset: blocked
      - count: nav_index
      - reset: nav_page
      - tap: navigator_open
    cooldown: 4

  # --- Way back to the navigator (Home → START → Event → navigator button) -----------------
  # The navigator button never showed up on a list that is done: Home, START, Event, button.
  - name: Navigator button missing → go home
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: [navigator_open, mission_dialog, new_mark]
      static_for: 45
      counter_at_least: {misses: 3}
      option: {next_event: "yes"}
    do: [{reset: nav_index}, {reset: nav_page}, {reset: in_stage}, {reset: blocked}, {reset: claimed}, {tap_xy: [0.09, 0.965]}]
    cooldown: 10

  - name: Home → START
    when:
      visible: home_screen
      not_visible: [menu_event, navigator_open, navigator_title]
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap: home_screen}]
    cooldown: 6

  - name: START menu → Event
    when:
      visible: menu_event
      not_visible: [navigator_open, stage_list, event_stage_row, navigator_title]
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap: menu_event}]
    cooldown: 6

  - name: Event menu → open the navigator
    when:
      visible: navigator_open
      not_visible: [stage_list, event_stage_row, navigator_title, mission_dialog, battle_screen, start_button, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      option: {next_event: "yes"}
    do: [{reset: lost}, {reset: nav_page}, {tap: navigator_open}]
    cooldown: 5

  # The navigator lists the events with Dragon Stones left, most stones first, three per page.
  # Entries that stay (a stage needs another team, ...) are skipped by index; a slow drag
  # scrolls the list by exactly three entries, so entry N is on page N // 3 at slot N % 3.
  - name: Navigator → scroll to page 2
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 3}
      counter_below: {nav_page: 1}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - swipe: {from: [0.5, 0.74], to: [0.5, 0.32], ms: 2000}
      - count: nav_page
    cooldown: 3

  - name: Navigator → scroll to page 3
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 6}
      counter_below: {nav_page: 2}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - swipe: {from: [0.5, 0.74], to: [0.5, 0.32], ms: 2000}
      - count: nav_page
    cooldown: 3

  - name: Navigator → scroll to page 4
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 9}
      counter_below: {nav_page: 3}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - swipe: {from: [0.5, 0.74], to: [0.5, 0.32], ms: 2000}
      - count: nav_page
    cooldown: 3

  - name: Navigator → open entry 1
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 0}
      counter_below: {nav_index: 1}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.24]}]
    cooldown: 3

  - name: Navigator → open entry 2
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 1}
      counter_below: {nav_index: 2}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.45]}]
    cooldown: 3

  - name: Navigator → open entry 3
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 2}
      counter_below: {nav_index: 3}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.66]}]
    cooldown: 3

  - name: Navigator → open entry 4
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 3, nav_page: 1}
      counter_below: {nav_index: 4}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.24]}]
    cooldown: 3

  - name: Navigator → open entry 5
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 4, nav_page: 1}
      counter_below: {nav_index: 5}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.45]}]
    cooldown: 3

  - name: Navigator → open entry 6
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 5, nav_page: 1}
      counter_below: {nav_index: 6}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.66]}]
    cooldown: 3

  - name: Navigator → open entry 7
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 6, nav_page: 2}
      counter_below: {nav_index: 7}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.24]}]
    cooldown: 3

  - name: Navigator → open entry 8
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 7, nav_page: 2}
      counter_below: {nav_index: 8}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.45]}]
    cooldown: 3

  - name: Navigator → open entry 9
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 8, nav_page: 2}
      counter_below: {nav_index: 9}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.66]}]
    cooldown: 3

  - name: Navigator → open entry 10
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 9, nav_page: 3}
      counter_below: {nav_index: 10}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.24]}]
    cooldown: 3

  - name: Navigator → open entry 11
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 10, nav_page: 3}
      counter_below: {nav_index: 11}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.45]}]
    cooldown: 3

  - name: Navigator → open entry 12
    when:
      visible: navigator_title
      counter_at_least: {nav_index: 11, nav_page: 3}
      counter_below: {nav_index: 12}
      option: {next_event: "yes"}
    do: [{reset: lost}, {tap_xy: [0.5, 0.66]}]
    cooldown: 3

  # Tapping an entry changes the screen. If the navigator stays as it is, the list may be
  # scrolled somewhere unexpected (the farm was restarted): look from the top once; if it still
  # stays as it is, there is no entry there and nothing usable is left.
  - name: Navigator → unchanged, look from the top
    when:
      visible: navigator_title
      static_for: 4
      counter_below: {nav_top: 1}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - count: nav_top
      - reset: nav_page
      - swipe: {from: [0.5, 0.25], to: [0.5, 0.8], ms: 400}
      - swipe: {from: [0.5, 0.25], to: [0.5, 0.8], ms: 400}
    cooldown: 3

  - name: Navigator → nothing usable left, stop
    when:
      visible: navigator_title
      static_for: 8
      counter_at_least: {nav_top: 1}
      option: {next_event: "yes"}
    do:
      - reset: lost
      - tap: ok_button
      - stop: "The Dragon Stone Navigator has no more events to play ({runs} stages cleared)."

  - name: No NEW stage left → stop (missions accepted)
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: [new_mark, mission_dialog]
      counter_at_least: {misses: 3, accepts: 1}
      option: {next_event: "no"}
    do:
      - reset: lost
      - stop: No uncleared stage left in this list ({stages_cleared} cleared), mission rewards accepted.

  - name: No NEW stage left → stop
    when:
      any_visible: [stage_list, event_stage_row]
      not_visible: new_mark
      counter_at_least: {misses: 3}
      option: {claim_missions: "no", next_event: "no"}
    do:
      - reset: lost
      - screenshot: no_new_stage
      - stop: No uncleared stage left in this list ({stages_cleared} cleared). Open the next area and start again.

  # --- Dialogs and fallbacks -------------------------------------------------------
  - name: Close popup
    when: {visible: close_button}
    do: [{reset: lost}, {tap: close_button}]
    cooldown: 2

  - name: Confirm (OK)
    when: {visible: ok_button, not_visible: [act_empty_dialog, defeat_give_up, restore_with_item, navigator_title]}
    do: [{reset: lost}, {tap: ok_button}]
    cooldown: 2

  # A tap that lands on a character (in battle, or while a battle starts) opens its
  # details, a page with only a "<<<" button: Back closes it (only on a still screen that
  # is no difficulty list: while a screen loads, its "<<<" is all there is to see).
  - name: Close a details page
    when:
      visible: back_button
      not_visible: [stage_list, event_stage_row, navigator_title, start_button, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      static_for: 4
    do: [{key: BACK}]
    cooldown: 3

  - name: Tap to continue
    when:
      static_for: $continue_after
      not_visible: [act_empty_dialog, defeat_give_up, stage_list, event_stage_row, restore_sta, navigator_title]
    do: [{tap_xy: [0.5, 0.15]}]
    cooldown: 4

  # The results screen of a stage has a popup ("... were cleared at the same time") that
  # hides its label, and the light behind it never stops moving, so the still-screen rule
  # above never fires. After 10 quiet seconds on a screen none of the rules knows, a tap
  # near the top (away from the buttons of dialogs) dismisses it; then Back;
  # and if even that does not help for a couple of minutes the routine stops (and notifies)
  # instead of tapping at the wrong screen for hours. Any recognised screen resets the count.
  - name: Nothing recognised → tap the top
    when:
      idle_for: 10
      not_visible: [act_empty_dialog, defeat_give_up, battle_screen, map_screen, stage_list, event_stage_row, start_button, error_retry, restore_sta, navigator_title, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      counter_below: {lost: 2}
    do: [{count: lost}, {tap_xy: [0.5, 0.15]}]
    cooldown: 4

  - name: Lost → press Back
    when:
      idle_for: 10
      not_visible: [act_empty_dialog, defeat_give_up, battle_screen, map_screen, stage_list, event_stage_row, start_button, error_retry, restore_sta, navigator_title, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      counter_at_least: {lost: 2}
      counter_below: {lost: 5}
    do: [{count: lost}, {key: BACK}]
    cooldown: 5

  # Back did not help: the HOME tab of the bottom bar. With "next event" the rules below then
  # lead on through START and Event to the Dragon Stone Navigator.
  - name: Lost → go home
    when:
      idle_for: 10
      not_visible: [act_empty_dialog, defeat_give_up, battle_screen, map_screen, stage_list, event_stage_row, start_button, error_retry, restore_sta, navigator_title, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      counter_at_least: {lost: 5}
      counter_below: {lost: 12}
    do: [{count: lost}, {reset: nav_index}, {reset: nav_page}, {reset: in_stage}, {tap_xy: [0.09, 0.965]}]
    cooldown: 5

  - name: Lost → give up and stop
    when:
      idle_for: 10
      not_visible: [act_empty_dialog, defeat_give_up, battle_screen, map_screen, stage_list, event_stage_row, start_button, error_retry, restore_sta, navigator_title, difficulty_normal, difficulty_hard, difficulty_zhard, difficulty_super]
      counter_at_least: {lost: 12}
    do:
      - screenshot: lost
      - notify: "Lost: the screen was not recognised for two minutes, Back did not help ({stages_cleared} stages cleared)."
      - stop: "Lost on a screen the routine does not know (see the 'lost' screenshot). Open an event or stage list and start again."
